<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="A modern, high-precision glassmorphic web calculator with real-time expressions, calculation history, audio feedback, and keyboard shortcuts.">
  <title>AeroCalc | Modern Glassmorphic Web Calculator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Ambient background glow lights -->
  <div class="glow-orb orb-1" aria-hidden="true"></div>
  <div class="glow-orb orb-2" aria-hidden="true"></div>
  <div class="glow-orb orb-3" aria-hidden="true"></div>

  <main class="calculator-app">
    <div class="calculator-card" id="calculator-card">
      <!-- Calculator Header -->
      <header class="calc-header">
        <div class="brand">
          <div class="brand-logo" aria-hidden="true">
            <span></span><span></span><span></span>
          </div>
          <h1 class="brand-title">Aero<span>Calc</span></h1>
        </div>
        <div class="header-actions">
          <button id="btn-sound-toggle" class="icon-btn" title="Toggle Sound Feedback" aria-label="Toggle sound">
            <svg id="sound-icon-on" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
              <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
              <path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path>
              <path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path>
            </svg>
            <svg id="sound-icon-off" class="hidden" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
              <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
              <line x1="23" y1="9" x2="17" y2="15"></line>
              <line x1="17" y1="9" x2="23" y2="15"></line>
            </svg>
          </button>
          <button id="btn-history-toggle" class="icon-btn" title="View Calculation History" aria-label="Toggle history">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="12" r="10"></circle>
              <polyline points="12 6 12 12 16 14"></polyline>
            </svg>
          </button>
        </div>
      </header>

      <!-- Calculator Display -->
      <section class="display-container" aria-label="Calculator Display">
        <div class="display-upper">
          <span id="previous-operand" class="expression-line" aria-live="polite"></span>
        </div>
        <div class="display-lower">
          <span id="current-operand" class="current-line" aria-live="polite">0</span>
          <button id="btn-copy-result" class="copy-btn" title="Copy result to clipboard" aria-label="Copy result">
            <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
              <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
            </svg>
            <span id="copy-tooltip" class="copy-tooltip">Copied!</span>
          </button>
        </div>
      </section>

      <!-- Quick Functions Sub-row -->
      <div class="scientific-row" aria-label="Quick Math Functions">
        <button id="btn-sqr" class="func-btn" data-action="sqr" title="Square (x²)">x²</button>
        <button id="btn-sqrt" class="func-btn" data-action="sqrt" title="Square Root (√x)">√x</button>
        <button id="btn-reciprocal" class="func-btn" data-action="reciprocal" title="Reciprocal (1/x)">1/x</button>
        <button id="btn-pi" class="func-btn" data-action="pi" title="Pi (3.14159...)">π</button>
      </div>

      <!-- Main Keypad Grid -->
      <section class="keypad" aria-label="Calculator Keypad">
        <!-- Row 1 -->
        <button id="btn-clear" class="btn btn-action btn-clear" data-action="clear" aria-label="All Clear">AC</button>
        <button id="btn-backspace" class="btn btn-action" data-action="backspace" aria-label="Backspace">⌫</button>
        <button id="btn-percent" class="btn btn-action" data-action="percent" aria-label="Percent">%</button>
        <button id="btn-divide" class="btn btn-operator" data-operator="÷" aria-label="Divide">÷</button>

        <!-- Row 2 -->
        <button id="btn-7" class="btn btn-number" data-number="7">7</button>
        <button id="btn-8" class="btn btn-number" data-number="8">8</button>
        <button id="btn-9" class="btn btn-number" data-number="9">9</button>
        <button id="btn-multiply" class="btn btn-operator" data-operator="×" aria-label="Multiply">×</button>

        <!-- Row 3 -->
        <button id="btn-4" class="btn btn-number" data-number="4">4</button>
        <button id="btn-5" class="btn btn-number" data-number="5">5</button>
        <button id="btn-6" class="btn btn-number" data-number="6">6</button>
        <button id="btn-subtract" class="btn btn-operator" data-operator="−" aria-label="Subtract">−</button>

        <!-- Row 4 -->
        <button id="btn-1" class="btn btn-number" data-number="1">1</button>
        <button id="btn-2" class="btn btn-number" data-number="2">2</button>
        <button id="btn-3" class="btn btn-number" data-number="3">3</button>
        <button id="btn-add" class="btn btn-operator" data-operator="+" aria-label="Add">+</button>

        <!-- Row 5 -->
        <button id="btn-toggle-sign" class="btn btn-number" data-action="sign" aria-label="Toggle Sign">±</button>
        <button id="btn-0" class="btn btn-number" data-number="0">0</button>
        <button id="btn-decimal" class="btn btn-number" data-action="decimal">.</button>
        <button id="btn-equals" class="btn btn-equals" data-action="equals" aria-label="Equals">=</button>
      </section>

      <!-- Key Helper / Shortcuts bar -->
      <footer class="calc-footer">
        <span>Keyboard ready: numbers, <code>+ - * /</code>, <code>Enter</code>, <code>Esc</code></span>
      </footer>

      <!-- History Slideout Drawer -->
      <aside id="history-drawer" class="history-drawer" aria-label="Calculation History">
        <div class="history-header">
          <h3>History</h3>
          <div class="history-actions">
            <button id="btn-clear-history" class="text-btn" title="Clear all history">Clear</button>
            <button id="btn-close-history" class="icon-btn" aria-label="Close history">✕</button>
          </div>
        </div>
        <div id="history-list" class="history-list">
          <div class="empty-history">No calculations yet</div>
        </div>
      </aside>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
